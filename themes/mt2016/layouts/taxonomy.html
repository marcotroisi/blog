{{ define "main" }}
<header class="blog__header page__header">
  <h1>{{ .Title }}</h1>
</header>
<article class="blog__wrap professional-page">
  <ul class="archive-list">
    {{- range .Data.Terms.Alphabetical }}
    <li>
      <a href="{{ .Page.RelPermalink }}">{{ .Page.LinkTitle }}</a>
      <span class="archive-list__date">({{ .Count }})</span>
    </li>
    {{- end }}
  </ul>
</article>
{{ end }}
