name: Build and publish

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.169.0"

      - name: Build
        run: ./build.sh

      - name: Publish to docs
        run: |
          rsync -a --delete public/ docs/
          touch docs/.nojekyll
          git config user.name "GitHub Actions"
          git config user.email "hello@marcotroisi.com"
          git add docs
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "Publish site"
            git push
          fi
